<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Credit Repair &amp; Mortgage Readiness Orchestrator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 10px; margin-bottom: 1.5rem; }
    label { display: block; margin-top: 0.75rem; font-size: 0.9rem; color: #cbd5e1; }
    input, textarea { width: 100%; padding: 0.55rem; margin-top: 0.25rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-family: inherit; }
    button { margin-top: 1.25rem; padding: 0.75rem 1.25rem; background: #10b981; color: #020617; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    pre { background: #020617; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.82rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Credit Repair &amp; Mortgage Readiness Orchestrator</h1>
  <div class="card">
    <h2>Member Credit Audit &amp; FCRA Dispute Generator</h2>
    <form id="creditForm">
      <label>First Name <input name="firstName" value="Alex" required /></label>
      <label>Last Name <input name="lastName" value="Mercer" required /></label>
      <label>Current FICO Score <input name="currentFico" type="number" value="585" required /></label>
      <label>LUCR Treasury Paydown Budget ($) <input name="budget" type="number" value="600" required /></label>
      <label>Target Indiana County <input name="county" value="Vigo" required /></label>
      <label>Annual Household Income ($) <input name="income" type="number" value="78000" required /></label>
      <button type="submit">Run FCRA Audit, Generate Letters &amp; Check Mortgage Handoff</button>
    </form>
  </div>
  <div class="card">
    <h3>Audit, Dispute Letters &amp; Handoff Result</h3>
    <pre id="output">Click the button above to audit sample tradelines and generate certified bureau dispute packets...</pre>
  </div>

  <script>
    document.getElementById("creditForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);

      const requestBody = {
        availablePaydownBudgetUsd: Number(fd.get("budget")),
        housingTarget: {
          email: "member@example.org",
          county: fd.get("county"),
          annualHouseholdIncome: Number(fd.get("income")),
          purchasePrice: 240000,
          loanAmount: 231600
        },
        profile: {
          memberId: "NWO-MEM-" + Date.now(),
          firstName: fd.get("firstName"),
          lastName: fd.get("lastName"),
          address: "123 Wabash Ave",
          city: "Terre Haute",
          state: "IN",
          zip: "47807",
          ssnLast4: "4821",
          currentFico: Number(fd.get("currentFico")),
          walletAddress: "0x71C7656EC7ab88b098defB751B7401B5f6d8976F",
          tradelines: [
            {
              accountId: "MED-9921",
              creditorName: "Regional Medical Recovery",
              accountType: "MEDICAL",
              balance: 340,
              creditLimit: 0,
              apr: 0,
              status: "COLLECTION",
              dateOfFirstDelinquency: "2023-04-10",
              bureausReporting: ["EQUIFAX", "EXPERIAN", "TRANSUNION"]
            },
            {
              accountId: "OLD-4410",
              creditorName: "Midland Funding LLC",
              originalCreditor: "Capital One",
              accountType: "COLLECTION",
              balance: 1250,
              creditLimit: 0,
              apr: 0,
              status: "COLLECTION",
              dateOfFirstDelinquency: "2018-02-15",
              bureausReporting: ["EQUIFAX", "TRANSUNION"]
            },
            {
              accountId: "REV-7712",
              creditorName: "Chase Freedom",
              accountType: "REVOLVING",
              balance: 1450,
              creditLimit: 2000,
              apr: 24.99,
              status: "OPEN",
              dateOfFirstDelinquency: null,
              bureausReporting: ["EQUIFAX", "EXPERIAN", "TRANSUNION"]
            }
          ]
        }
      };

      const res = await fetch("http://localhost:4100/api/credit/rehabilitate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody)
      });
      const data = await res.json();
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
